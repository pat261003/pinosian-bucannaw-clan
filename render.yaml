# Database is hosted separately on Neon Free. No Render database is provisioned.
services:
  - type: web
    name: reunion-api
    runtime: node
    plan: free
    buildCommand: npm ci --workspace server --include-workspace-root
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FRONTEND_URL
        sync: false
